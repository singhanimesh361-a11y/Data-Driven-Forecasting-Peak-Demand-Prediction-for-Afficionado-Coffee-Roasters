# ============================================================================
# ADIP — Continuous Integration / Continuous Deployment
# ============================================================================
name: ADIP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

# Cancel redundant runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # JOB 1: Lint — code quality gates
  # ==========================================================================
  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 black isort mypy

      - name: Run flake8
        run: |
          flake8 src/ dashboard/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --statistics \
            --count

      - name: Check black formatting
        run: black --check --diff --line-length=120 src/ dashboard/

      - name: Check isort import ordering
        run: isort --check-only --diff --profile black --line-length 120 src/ dashboard/

  # ==========================================================================
  # JOB 2: Unit Tests — pytest with coverage enforcement
  # ==========================================================================
  test:
    name: "Unit Tests (coverage ≥ 80%)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -n auto \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=50 \
            --junitxml=test-results.xml \
            -m "not integration"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ==========================================================================
  # JOB 3: Integration Tests — end-to-end pipeline validation
  # ==========================================================================
  integration-test:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run integration tests
        run: |
          pytest tests/ \
            -v \
            --tb=long \
            -m "integration" \
            --timeout=300
        env:
          ADIP_ENV: test
          ADIP_TEST_DATA_DIR: ./data/processed

      - name: Validate forecast pipeline (smoke test)
        run: |
          python -m src.serving.forecast_engine --mode=once --horizon=7 || true

  # ==========================================================================
  # JOB 4: Build — Docker image + push to GHCR
  # ==========================================================================
  build:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ==========================================================================
  # JOB 5: Deploy — push to Render or AWS ECS
  # ==========================================================================
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Option A: Render deploy via webhook ---
      - name: Deploy to Render
        if: vars.DEPLOY_TARGET == 'render'
        run: |
          echo "Triggering Render deploy hook..."
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            | grep -q "200" && echo "Deploy triggered" || exit 1

      # --- Option B: AWS ECS deploy ---
      - name: Configure AWS credentials
        if: vars.DEPLOY_TARGET == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to ECS
        if: vars.DEPLOY_TARGET == 'aws'
        run: |
          aws ecs update-service \
            --cluster adip-production \
            --service adip-app \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}
          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable \
            --cluster adip-production \
            --services adip-app \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify deployment health
        run: |
          DEPLOY_URL="${{ vars.DEPLOY_URL }}"
          echo "Checking health at ${DEPLOY_URL}/health ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/_stcore/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

  # ==========================================================================
  # Notifications — Slack on success/failure
  # ==========================================================================
  notify:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, integration-test, build, deploy]
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "color=#36a64f" >> $GITHUB_OUTPUT
            echo "status=✅ Deployed Successfully" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy.result }}" == "skipped" && "${{ needs.build.result }}" == "success" ]]; then
            echo "color=#36a64f" >> $GITHUB_OUTPUT
            echo "status=✅ Build Passed (deploy skipped)" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.test.result }}" == "success" && "${{ needs.deploy.result }}" == "skipped" ]]; then
            echo "color=#daa038" >> $GITHUB_OUTPUT
            echo "status=⚠️ Tests Passed (non-deploy branch)" >> $GITHUB_OUTPUT
          else
            echo "color=#dc3545" >> $GITHUB_OUTPUT
            echo "status=❌ Pipeline Failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: vars.SLACK_NOTIFICATIONS_ENABLED == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*ADIP Pipeline* — ${{ steps.status.outputs.status }}\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}` by ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
